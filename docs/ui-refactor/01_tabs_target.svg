<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="system-ui, sans-serif">
  <rect width="1100" height="700" fill="#1a1c22"/>
  <text x="20" y="28" fill="#e8eaed" font-size="16" font-weight="600">Phase 5 + 6 — Debug Panel tab contents (target)</text>
  <text x="20" y="48" fill="#9aa0a6" font-size="11">All flag names verified to exist in RegistrationActions.h / RegistrationImGuiManager.h</text>

  <g transform="translate(20, 80)">
    <text x="0" y="-8" fill="#9aa0a6" font-size="11" font-weight="500">W tab — Shift+W series (Phase 5)</text>
    <rect width="340" height="600" fill="#2a2d35" stroke="#3d4148" rx="4"/>
    <text x="14" y="22" fill="#d090e8" font-size="11" font-weight="500">W — Shift+W series — RIM debug</text>
    <line x1="0" y1="32" x2="340" y2="32" stroke="#3d4148"/>

    <g transform="translate(14, 44)">
      <text x="0" y="14" fill="#7388a8" font-size="10">Stage 0 — Raw / Smoothed / Ordered RIM:</text>
      <rect x="0" y="20" width="312" height="14" fill="#1a1c22" stroke="#4a4d55"/>
      <text x="6" y="31" fill="#cdd0d6" font-size="10">☐ CB0  Raw RIM 2D projection</text>
      <rect x="0" y="38" width="312" height="14" fill="#1a1c22" stroke="#4a4d55"/>
      <text x="6" y="49" fill="#cdd0d6" font-size="10">☐ CB0.1  Smoothed RIM (grid + KNN)</text>
      <rect x="0" y="56" width="312" height="14" fill="#1a1c22" stroke="#4a4d55"/>
      <text x="6" y="67" fill="#cdd0d6" font-size="10">☐ CB0.2  Ordered RIM (MST + longest path)</text>
      <rect x="0" y="74" width="312" height="14" fill="#1a1c22" stroke="#4a4d55"/>
      <text x="6" y="85" fill="#cdd0d6" font-size="10">☐ CB0.3  Manual Sweep Probe</text>
    </g>

    <g transform="translate(14, 144)">
      <text x="0" y="14" fill="#7388a8" font-size="10">Stage 3d — Source / Target rim:</text>
      <rect x="0" y="20" width="312" height="14" fill="#1a1c22" stroke="#4a4d55"/>
      <text x="6" y="31" fill="#cdd0d6" font-size="10">☐ CB1  Source 2D projection (envelope + pivots)</text>
      <rect x="0" y="38" width="312" height="14" fill="#1a1c22" stroke="#4a4d55"/>
      <text x="6" y="49" fill="#cdd0d6" font-size="10">☐ CB2  Target lower-half + anchors</text>
    </g>

    <g transform="translate(14, 214)">
      <text x="0" y="14" fill="#7388a8" font-size="10">Source RIM method (Ctrl+Alt+W sweep):</text>
      <rect x="0" y="20" width="312" height="14" fill="#1a1c22" stroke="#4a4d55"/>
      <text x="6" y="31" fill="#cdd0d6" font-size="10">⦿ MST longest path  ○ Envelope (legacy)</text>
    </g>

    <g transform="translate(14, 264)">
      <text x="0" y="14" fill="#7388a8" font-size="10">Smoothing parameters (CB0.1):</text>
      <text x="0" y="32" fill="#9aa0a6" font-size="9">Grid px: 15.0    KNN K: 5    Iters: 2</text>
      <rect x="0" y="38" width="312" height="10" fill="#1a1c22" stroke="#4a4d55"/>
    </g>

    <g transform="translate(14, 310)">
      <text x="0" y="14" fill="#7388a8" font-size="10">Ordering parameters (CB0.2):</text>
      <text x="0" y="32" fill="#9aa0a6" font-size="9">Max edge px: 100.0    N pivots: 20</text>
      <rect x="0" y="38" width="312" height="10" fill="#1a1c22" stroke="#4a4d55"/>
      <text x="6" y="60" fill="#cdd0d6" font-size="10">☐ Show MST  ☑ Show cleaned</text>
    </g>

    <g transform="translate(14, 378)">
      <text x="0" y="14" fill="#7388a8" font-size="10">Sweep candidate filters (safety):</text>
      <text x="6" y="30" fill="#cdd0d6" font-size="10">☑ Check A: rotation cap (±30°)</text>
      <text x="6" y="44" fill="#cdd0d6" font-size="10">☑ Check B: CC orient (±15°)</text>
    </g>

    <g transform="translate(14, 436)">
      <text x="0" y="14" fill="#7388a8" font-size="10">Sweep animation:</text>
      <text x="6" y="30" fill="#cdd0d6" font-size="10">☑ Animate    ☐ Verbose log</text>
      <text x="6" y="44" fill="#9aa0a6" font-size="9">Phase 1 frames: 60    Phase 2 frames: 30</text>
    </g>

    <line x1="0" y1="498" x2="340" y2="498" stroke="#3d4148"/>

    <g transform="translate(14, 510)">
      <text x="0" y="14" fill="#7388a8" font-size="10">Silhouette IoU diagnostic:</text>
      <rect x="0" y="20" width="180" height="20" fill="#1a4480" rx="2"/>
      <text x="90" y="34" fill="#dde6f5" font-size="10" text-anchor="middle">F9: Toggle Silhouette IoU</text>
      <text x="186" y="34" fill="#9aa0a6" font-size="9">(currently closed)</text>
    </g>
  </g>

  <g transform="translate(380, 80)">
    <text x="0" y="-8" fill="#9aa0a6" font-size="11" font-weight="500">O tab — Shift+O series (Phase 6)</text>
    <rect width="340" height="380" fill="#2a2d35" stroke="#3d4148" rx="4"/>
    <text x="14" y="22" fill="#f5b078" font-size="11" font-weight="500">O — Shift+O — HemiAuto / QuadAuto</text>
    <line x1="0" y1="32" x2="340" y2="32" stroke="#3d4148"/>

    <g transform="translate(14, 44)">
      <text x="0" y="14" fill="#7388a8" font-size="10">Voxel size (downsampling):</text>
      <rect x="0" y="20" width="312" height="14" fill="#1a1c22" stroke="#4a4d55"/>
      <rect x="0" y="20" width="100" height="14" fill="#3b5a2a"/>
      <text x="156" y="31" fill="#cdd0d6" font-size="9" text-anchor="middle">0.50</text>
      <text x="0" y="48" fill="#9aa0a6" font-size="9">Recommended: 1:1=0.30  1:1.5=0.45  1:2=0.60</text>
    </g>

    <g transform="translate(14, 122)">
      <text x="0" y="14" fill="#7388a8" font-size="10">Instrument-mask Px threshold:</text>
      <rect x="0" y="20" width="312" height="14" fill="#1a1c22" stroke="#4a4d55"/>
      <rect x="0" y="20" width="100" height="14" fill="#5a4030"/>
      <text x="156" y="31" fill="#cdd0d6" font-size="9" text-anchor="middle">15 px</text>
      <text x="0" y="48" fill="#9aa0a6" font-size="9">Affects next Shift+O. Use B key to see rejection.</text>
    </g>

    <g transform="translate(14, 200)">
      <text x="0" y="14" fill="#7388a8" font-size="10">AutoProbe iterations:</text>
      <rect x="0" y="20" width="312" height="14" fill="#1a1c22" stroke="#4a4d55"/>
      <rect x="0" y="20" width="60" height="14" fill="#3a4068"/>
      <text x="156" y="31" fill="#cdd0d6" font-size="9" text-anchor="middle">K = 9</text>
      <rect x="0" y="48" width="312" height="22" fill="#3b2412" rx="2"/>
      <text x="156" y="63" fill="#f5b078" font-size="10" text-anchor="middle">Run AutoProbe × K</text>
    </g>

    <g transform="translate(14, 290)">
      <text x="0" y="14" fill="#7388a8" font-size="10">Visualization shortcut:</text>
      <text x="6" y="32" fill="#9aa0a6" font-size="9">Cluster ON/OFF — see Viz tab (key J)</text>
      <text x="6" y="46" fill="#9aa0a6" font-size="9">Boundary candidates — see Viz tab (key B)</text>
    </g>
  </g>

  <g transform="translate(740, 80)">
    <text x="0" y="-8" fill="#9aa0a6" font-size="11" font-weight="500">U tab — Umeyama (Phase 6)</text>
    <rect width="340" height="380" fill="#2a2d35" stroke="#3d4148" rx="4"/>
    <text x="14" y="22" fill="#7ec0d8" font-size="11" font-weight="500">U — Umeyama Manual diagnostics</text>
    <line x1="0" y1="32" x2="340" y2="32" stroke="#3d4148"/>

    <g transform="translate(14, 44)">
      <text x="0" y="14" fill="#9aa0a6" font-size="9">Read-only view. Operate via sidebar Umeyama Manual.</text>
    </g>

    <g transform="translate(14, 74)">
      <text x="0" y="14" fill="#7388a8" font-size="10">Current session:</text>
      <text x="0" y="32" fill="#cdd0d6" font-size="10">Board points:  3 / 5</text>
      <text x="0" y="48" fill="#cdd0d6" font-size="10">Object points: 3 / 5</text>
      <rect x="180" y="22" width="120" height="14" fill="#1a1c22"/>
      <rect x="180" y="22" width="72" height="14" fill="#3b5a2a"/>
      <rect x="180" y="38" width="120" height="14" fill="#1a1c22"/>
      <rect x="180" y="38" width="72" height="14" fill="#3b5a2a"/>
    </g>

    <g transform="translate(14, 144)">
      <text x="0" y="14" fill="#a0d090" font-size="10" font-weight="500">Last result:</text>
      <text x="0" y="32" fill="#9aa0a6" font-size="10">Avg error:</text>
      <text x="200" y="32" fill="#cdd0d6" font-size="10" text-anchor="end">2.341 mm</text>
      <text x="0" y="48" fill="#9aa0a6" font-size="10">RMSE:</text>
      <text x="200" y="48" fill="#cdd0d6" font-size="10" text-anchor="end">2.876 mm</text>
      <text x="0" y="64" fill="#9aa0a6" font-size="10">Max error:</text>
      <text x="200" y="64" fill="#cdd0d6" font-size="10" text-anchor="end">4.523 mm</text>
      <text x="0" y="80" fill="#9aa0a6" font-size="10">Scale factor:</text>
      <text x="200" y="80" fill="#cdd0d6" font-size="10" text-anchor="end">0.9987</text>
    </g>

    <g transform="translate(14, 250)">
      <text x="0" y="14" fill="#7388a8" font-size="10">Visualization shortcut:</text>
      <text x="6" y="32" fill="#9aa0a6" font-size="9">CorresPoints ON/OFF — see Viz tab</text>
    </g>
  </g>

  <g transform="translate(380, 480)">
    <rect width="700" height="180" fill="#1a221a" stroke="#3a5030" rx="4"/>
    <text x="14" y="22" fill="#9fd07a" font-size="11" font-weight="500">✓ 全フィールド・コールバック存在確認済 (調査済)</text>
    <line x1="0" y1="32" x2="700" y2="32" stroke="#3a5030"/>
    <text x="14" y="50" fill="#cdd0d6" font-size="10">Phase 5 (W タブ): RegistrationActions.h 内に `g_debugShow2DProjPopup_*` 6 個確認</text>
    <text x="22" y="64" fill="#9aa0a6" font-size="9">- g_debugShow2DProjPopup_RawRim / RawRimSmoothed / RawRimOrdered / Source / Target</text>
    <text x="22" y="76" fill="#9aa0a6" font-size="9">- 加えて g_silhouetteSweepEnable / sweep frame / safety check toggles も同所</text>
    <text x="14" y="98" fill="#cdd0d6" font-size="10">Phase 6 (O/U タブ): RegistrationImGuiManager.h 内に全フィールド存在確認</text>
    <text x="22" y="112" fill="#9aa0a6" font-size="9">- hemiVoxelSize / instrumentPxThresh / iterCycles / boardPtCount / etc.</text>
    <text x="22" y="124" fill="#9aa0a6" font-size="9">- onHemiVoxelChanged / onInstrumentPxThreshChanged / onIterativeAutoProbe 確認</text>
    <text x="14" y="146" fill="#cdd0d6" font-size="10">Phase 8 (サイドバー): drawRegistrationSection 内コールバック 15 種特定済</text>
    <text x="22" y="160" fill="#9aa0a6" font-size="9">- onQuadAuto も RegUIActions に既に存在 (Hemi Auto → Hemi Quad 改名 OK)</text>
  </g>
</svg>
