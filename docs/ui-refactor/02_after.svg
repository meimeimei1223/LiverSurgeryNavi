<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="system-ui, sans-serif">
  <rect width="1000" height="700" fill="#1a1c22"/>

  <text x="20" y="28" fill="#e8eaed" font-size="16" font-weight="600">AFTER — Registration mode (target state)</text>
  <text x="20" y="48" fill="#9aa0a6" font-size="11">Main sidebar = production workflow only.  Debug Panel (Ctrl+D) = consolidated tabbed reference for all debugging.</text>

  <g transform="translate(20, 80)">
    <text x="0" y="-8" fill="#9aa0a6" font-size="10">Debug Panel — opens via Ctrl+D toggle (was: 3 always-on floating windows)</text>
    <rect width="540" height="500" fill="#2a2d35" stroke="#3d4148" rx="4"/>
    <text x="14" y="22" fill="#cdd0d6" font-size="11" font-weight="500">Debug Panel  (Ctrl+D)</text>
    <line x1="0" y1="32" x2="540" y2="32" stroke="#3d4148"/>

    <g transform="translate(0, 32)">
      <rect width="90" height="32" fill="#1a0f04" stroke="#3d4148"/>
      <text x="45" y="20" fill="#f08e30" font-size="11" text-anchor="middle" font-weight="500">G</text>
      <rect x="90" width="90" height="32" fill="#0d0e14" stroke="#3d4148"/>
      <text x="135" y="20" fill="#9aa0a6" font-size="11" text-anchor="middle">O</text>
      <rect x="180" width="90" height="32" fill="#0d0e14" stroke="#3d4148"/>
      <text x="225" y="20" fill="#9aa0a6" font-size="11" text-anchor="middle">N</text>
      <rect x="270" width="90" height="32" fill="#0d0e14" stroke="#3d4148"/>
      <text x="315" y="20" fill="#9aa0a6" font-size="11" text-anchor="middle">W</text>
      <rect x="360" width="90" height="32" fill="#0d0e14" stroke="#3d4148"/>
      <text x="405" y="20" fill="#9aa0a6" font-size="11" text-anchor="middle">U</text>
      <rect x="450" width="90" height="32" fill="#0d0e14" stroke="#3d4148"/>
      <text x="495" y="20" fill="#9aa0a6" font-size="11" text-anchor="middle">Viz</text>
    </g>

    <g transform="translate(14, 78)">
      <text x="0" y="0" fill="#f08e30" font-size="11" font-weight="500">G — Ctrl+G / Ctrl+Shift+G — V3-R BIPOP-CMA-ES</text>

      <g transform="translate(0, 12)">
        <rect x="0" y="0" width="512" height="120" fill="#0a1118" rx="3"/>
        <text x="10" y="14" fill="#7388a8" font-size="9">Quadrant subset selection (g_activeQuadrantMask)</text>
        <rect x="10" y="20" width="240" height="38" fill="#1a1c22" stroke="#4a4d55"/>
        <text x="130" y="36" fill="#cdd0d6" font-size="10" text-anchor="middle">☑ ant_R (123 v)</text>
        <text x="130" y="50" fill="#cdd0d6" font-size="9" text-anchor="middle">drag-select supported</text>
        <rect x="252" y="20" width="240" height="38" fill="#1a1c22" stroke="#4a4d55"/>
        <text x="372" y="36" fill="#cdd0d6" font-size="10" text-anchor="middle">☑ ant_L (98 v)</text>
        <rect x="10" y="60" width="240" height="38" fill="#1a1c22" stroke="#4a4d55"/>
        <text x="130" y="76" fill="#cdd0d6" font-size="10" text-anchor="middle">☑ pos_R (210 v)</text>
        <rect x="252" y="60" width="240" height="38" fill="#1a1c22" stroke="#4a4d55"/>
        <text x="372" y="76" fill="#cdd0d6" font-size="10" text-anchor="middle">☑ pos_L (180 v)</text>
        <text x="10" y="114" fill="#9aa0a6" font-size="9">Subset: 611 / 1234 vertices  Mask: ALL (0x0F)</text>
      </g>

      <g transform="translate(0, 142)">
        <rect x="0" y="0" width="512" height="60" fill="#0a1118" rx="3"/>
        <text x="10" y="14" fill="#7388a8" font-size="9">Search dimension (Ctrl+G)</text>
        <text x="10" y="32" fill="#cdd0d6" font-size="10">⦿ 7-DoF (default)    ○ 6-DoF rigid    ○ 4-DoF XY+RX+RY</text>
        <text x="10" y="50" fill="#9aa0a6" font-size="9">Reduces drift on repeated runs. 7→6→4 workflow recommended.</text>
      </g>

      <g transform="translate(0, 212)">
        <rect x="0" y="0" width="512" height="70" fill="#0a1118" rx="3"/>
        <text x="10" y="14" fill="#7388a8" font-size="9">RIM weighting / raycast (Ctrl+G / Ctrl+Shift+G)</text>
        <text x="10" y="32" fill="#cdd0d6" font-size="10">☑ AR-vis filter   ☐ Caudal-only   β rim_wt: 0.40</text>
        <text x="10" y="50" fill="#cdd0d6" font-size="10">λ rim_sil: 0.25   (Ctrl+Shift+G)</text>
      </g>

      <g transform="translate(0, 292)">
        <rect x="0" y="0" width="512" height="38" fill="#0a1118" rx="3"/>
        <text x="10" y="14" fill="#7388a8" font-size="9">Diagnostics</text>
        <rect x="10" y="20" width="120" height="14" fill="#1a4480" rx="2"/>
        <text x="70" y="30" fill="#dde6f5" font-size="9" text-anchor="middle">F9: Silhouette IoU</text>
      </g>
    </g>
  </g>

  <g transform="translate(580, 80)">
    <text x="0" y="-8" fill="#9aa0a6" font-size="10">Main sidebar — production workflow only</text>
    <rect width="320" height="500" fill="#11131a" stroke="#3d4148" rx="2"/>
    <rect width="320" height="36" fill="#0d0e14"/>
    <text x="160" y="22" fill="#9aa0a6" font-size="10" text-anchor="middle">① Depth ── ② Registration ── ③ Deform</text>
    <line x1="0" y1="36" x2="320" y2="36" stroke="#3d4148"/>
    <rect y="36" width="320" height="24" fill="#0d0e14"/>
    <text x="14" y="52" fill="#9aa0a6" font-size="10">▸ DEPTH GENERATION  [done]</text>
    <line x1="0" y1="60" x2="320" y2="60" stroke="#3d4148"/>
    <rect y="60" width="320" height="24" fill="#1a0f04"/>
    <text x="14" y="76" fill="#f08e30" font-size="10" font-weight="500">▾ REGISTRATION</text>

    <rect x="8" y="92" width="304" height="16" fill="#0a1118" rx="2"/>
    <text x="14" y="103" fill="#7388a8" font-size="9">▸ INITIAL ORIENTATION  [Q:ALL | Base]</text>

    <rect x="8" y="114" width="304" height="22" fill="#1a4480" rx="2"/>
    <text x="160" y="129" fill="#dde6f5" font-size="11" text-anchor="middle">Apply Init Pose</text>

    <g transform="translate(8, 142)">
      <rect width="200" height="26" fill="#3b2412" rx="2"/>
      <text x="100" y="17" fill="#f5b078" font-size="10" text-anchor="middle">Hemi Quad (Shift+O)</text>
      <rect x="204" width="100" height="26" fill="#3b2412" rx="2"/>
      <text x="254" y="17" fill="#f5b078" font-size="10" text-anchor="middle">Probe</text>
    </g>

    <g transform="translate(8, 172)">
      <rect width="200" height="26" fill="#3b2412" rx="2"/>
      <text x="100" y="17" fill="#f5b078" font-size="10" text-anchor="middle">AutoQCR</text>
      <rect x="204" width="100" height="26" fill="#11151e" rx="2"/>
      <text x="254" y="17" fill="#7388a8" font-size="9" text-anchor="middle">▸ QCR Tuning</text>
    </g>

    <g transform="translate(8, 202)">
      <rect width="200" height="30" fill="#3b2412" rx="2"/>
      <text x="100" y="19" fill="#f5b078" font-size="11" text-anchor="middle" font-weight="500">Ctrl+G</text>
      <rect x="204" width="100" height="30" fill="#11151e" rx="2"/>
      <text x="254" y="19" fill="#7388a8" font-size="9" text-anchor="middle">▸ Advanced</text>
    </g>

    <rect x="8" y="240" width="304" height="20" fill="#11151e" rx="2"/>
    <text x="160" y="253" fill="#cdd0d6" font-size="10" text-anchor="middle">Umeyama Manual</text>

    <g transform="translate(8, 268)">
      <rect width="200" height="20" fill="#11151e" rx="2"/>
      <text x="100" y="13" fill="#cdd0d6" font-size="10" text-anchor="middle">Pose Library  (3 entries)</text>
      <rect x="204" width="100" height="20" fill="#11151e" rx="2"/>
      <text x="254" y="13" fill="#cdd0d6" font-size="10" text-anchor="middle">Pose Undo</text>
    </g>

    <g transform="translate(8, 300)">
      <rect width="100" height="22" fill="#1a2a1a" rx="2"/>
      <text x="50" y="14" fill="#9fd07a" font-size="10" text-anchor="middle">Deform &gt;&gt;</text>
      <rect x="104" width="100" height="22" fill="#0e2128" rx="2"/>
      <text x="154" y="14" fill="#7ec0d0" font-size="10" text-anchor="middle">&lt;&lt; Depth</text>
      <rect x="208" width="96" height="22" fill="#2a0e0e" rx="2"/>
      <text x="256" y="14" fill="#e85555" font-size="10" text-anchor="middle">Reset</text>
    </g>

    <line x1="0" y1="336" x2="320" y2="336" stroke="#3d4148"/>
    <text x="14" y="354" fill="#9aa0a6" font-size="10">▸ DEFORM</text>

    <rect x="8" y="430" width="304" height="60" fill="#0a1118" stroke="#3d4148" rx="3" stroke-dasharray="3 2"/>
    <text x="14" y="446" fill="#9aa0a6" font-size="9" font-style="italic">削除されたもの:</text>
    <text x="14" y="460" fill="#7a7d85" font-size="9">  - Cluster ON/OFF, CorresPoints toggle</text>
    <text x="14" y="472" fill="#7a7d85" font-size="9">  - Clear CorresPoints (バグ修正)</text>
    <text x="14" y="484" fill="#7a7d85" font-size="9">  - 外側 Undo (Umeyama 子 window と重複)</text>
  </g>

  <g transform="translate(20, 600)">
    <rect width="880" height="80" fill="#1a221a" stroke="#3a5030" rx="4"/>
    <text x="14" y="22" fill="#9fd07a" font-size="11" font-weight="500">✓ 改善ポイント</text>
    <text x="14" y="42" fill="#cdd0d6" font-size="10">• Main sidebar の REGISTRATION 行数: 14 → 8 段に減 (約 43% 縮小)</text>
    <text x="14" y="58" fill="#cdd0d6" font-size="10">• 常時 floating: 3 個 → 0 個 (Debug Panel は Ctrl+D で必要時のみ)</text>
    <text x="14" y="74" fill="#cdd0d6" font-size="10">• Pose Library はメイン残留 (production workflow の一部のため)</text>
    <text x="470" y="42" fill="#cdd0d6" font-size="10">• キー系で整理: G / O / N / W / U / Viz の 6 タブ</text>
    <text x="470" y="58" fill="#cdd0d6" font-size="10">• F9 Silhouette window は G タブと W タブ両方から起動可</text>
    <text x="470" y="74" fill="#cdd0d6" font-size="10">• Clear CorresPoints バグ修正 (DEPTH に正しく戻す)</text>
  </g>
</svg>
