<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="system-ui, sans-serif">
  <rect width="1000" height="700" fill="#1a1c22"/>

  <text x="20" y="28" fill="#e8eaed" font-size="16" font-weight="600">BEFORE — Registration mode (current state)</text>
  <text x="20" y="48" fill="#9aa0a6" font-size="11">Main sidebar (right) + 3 always-on floating panels + up to 6 popup windows on key press</text>

  <g transform="translate(20, 80)">
    <text x="0" y="-8" fill="#9aa0a6" font-size="10">Floating "Ctrl+G Quadrant Selector"</text>
    <rect width="280" height="280" fill="#2a2d35" stroke="#3d4148" rx="4"/>
    <text x="14" y="22" fill="#cdd0d6" font-size="11" font-weight="500">Ctrl+G Quadrant Selector</text>
    <line x1="0" y1="32" x2="280" y2="32" stroke="#3d4148"/>
    <text x="14" y="50" fill="#9aa0a6" font-size="10">Anatomical orientation:</text>
    <text x="14" y="66" fill="#9aa0a6" font-size="10">Top=anterior, Left=patient's right</text>
    <rect x="14" y="76" width="120" height="42" fill="#1a1c22" stroke="#4a4d55"/>
    <text x="74" y="92" fill="#cdd0d6" font-size="10" text-anchor="middle">☐ ant_R</text>
    <text x="74" y="108" fill="#7a7d85" font-size="9" text-anchor="middle">(123 v)</text>
    <rect x="138" y="76" width="120" height="42" fill="#1a1c22" stroke="#4a4d55"/>
    <text x="198" y="92" fill="#cdd0d6" font-size="10" text-anchor="middle">☐ ant_L</text>
    <rect x="14" y="120" width="120" height="42" fill="#1a1c22" stroke="#4a4d55"/>
    <text x="74" y="136" fill="#cdd0d6" font-size="10" text-anchor="middle">☐ pos_R</text>
    <rect x="138" y="120" width="120" height="42" fill="#1a1c22" stroke="#4a4d55"/>
    <text x="198" y="136" fill="#cdd0d6" font-size="10" text-anchor="middle">☐ pos_L</text>
    <text x="14" y="180" fill="#9aa0a6" font-size="10">Subset: 1234 / 5678 unique vertices</text>
    <text x="14" y="196" fill="#9aa0a6" font-size="10">Mask: ALL (0x0F)</text>
    <rect x="14" y="206" width="50" height="20" fill="#3d4148" rx="2"/>
    <text x="39" y="220" fill="#cdd0d6" font-size="10" text-anchor="middle">All</text>
    <rect x="68" y="206" width="78" height="20" fill="#3d4148" rx="2"/>
    <text x="107" y="220" fill="#cdd0d6" font-size="10" text-anchor="middle">Anterior only</text>
    <rect x="150" y="206" width="60" height="20" fill="#3d4148" rx="2"/>
    <text x="180" y="220" fill="#cdd0d6" font-size="10" text-anchor="middle">Right only</text>
    <rect x="214" y="206" width="50" height="20" fill="#3d4148" rx="2"/>
    <text x="239" y="220" fill="#cdd0d6" font-size="10" text-anchor="middle">None</text>
    <line x1="0" y1="236" x2="280" y2="236" stroke="#3d4148"/>
    <text x="14" y="252" fill="#9fd07a" font-size="10">Search dimension (Ctrl+G)</text>
    <text x="14" y="266" fill="#cdd0d6" font-size="10">⦿ 7-DoF  ○ 6-DoF  ○ 4-DoF</text>
  </g>

  <g transform="translate(320, 80)">
    <text x="0" y="-8" fill="#9aa0a6" font-size="10">Floating "Normal-Compatible Refine"</text>
    <rect width="260" height="220" fill="#2a2d35" stroke="#3d4148" rx="4"/>
    <text x="14" y="22" fill="#cdd0d6" font-size="11" font-weight="500">Normal-Compatible Refine (Shift+N)</text>
    <line x1="0" y1="32" x2="260" y2="32" stroke="#3d4148"/>
    <text x="14" y="50" fill="#a3d0a3" font-size="10">Finishing-pass refinement after Ctrl+G</text>
    <text x="14" y="74" fill="#cdd0d6" font-size="10">☑ Enabled    ☑ Live mode</text>
    <line x1="14" y1="84" x2="246" y2="84" stroke="#3d4148"/>
    <text x="14" y="100" fill="#9aa0a6" font-size="10">RIM weights (Phase 2 L1):</text>
    <rect x="14" y="106" width="232" height="14" fill="#1a1c22" stroke="#4a4d55"/>
    <text x="14" y="138" fill="#9aa0a6" font-size="10">Anchor controls (Phase 3 L2):</text>
    <rect x="14" y="144" width="232" height="14" fill="#1a1c22" stroke="#4a4d55"/>
    <text x="14" y="176" fill="#9aa0a6" font-size="10">Solver knobs:</text>
    <rect x="14" y="182" width="232" height="14" fill="#1a1c22" stroke="#4a4d55"/>
  </g>

  <g transform="translate(320, 320)">
    <text x="0" y="-8" fill="#9aa0a6" font-size="10">Floating "ScreenMesh Display"</text>
    <rect width="260" height="140" fill="#2a2d35" stroke="#3d4148" rx="4"/>
    <text x="14" y="22" fill="#cdd0d6" font-size="11" font-weight="500">ScreenMesh Display</text>
    <line x1="0" y1="32" x2="260" y2="32" stroke="#3d4148"/>
    <text x="14" y="50" fill="#cdd0d6" font-size="10">☑ Draw as points (lightweight)</text>
    <text x="14" y="68" fill="#9aa0a6" font-size="10">Point size [px]</text>
    <rect x="14" y="74" width="232" height="10" fill="#1a1c22" stroke="#4a4d55"/>
    <text x="14" y="100" fill="#9aa0a6" font-size="10">Density [%]</text>
    <rect x="14" y="106" width="232" height="10" fill="#1a1c22" stroke="#4a4d55"/>
    <text x="14" y="128" fill="#cdd0d6" font-size="10">☑ Show debug AABB (red=tgt, green=src)</text>
  </g>

  <g transform="translate(600, 80)">
    <text x="0" y="-8" fill="#9aa0a6" font-size="10">Main sidebar (right edge, 400px wide)</text>
    <rect width="320" height="580" fill="#11131a" stroke="#3d4148" rx="2"/>
    <rect width="320" height="36" fill="#0d0e14"/>
    <text x="160" y="22" fill="#9aa0a6" font-size="10" text-anchor="middle">① Depth ── ② Registration ── ③ Deform</text>
    <line x1="0" y1="36" x2="320" y2="36" stroke="#3d4148"/>
    <rect y="36" width="320" height="24" fill="#0d0e14"/>
    <text x="14" y="52" fill="#9aa0a6" font-size="10">▸ DEPTH GENERATION  [done]</text>
    <line x1="0" y1="60" x2="320" y2="60" stroke="#3d4148"/>
    <rect y="60" width="320" height="24" fill="#1a0f04"/>
    <text x="14" y="76" fill="#f08e30" font-size="10" font-weight="500">▾ REGISTRATION  [active]</text>
    <g transform="translate(8, 92)">
      <rect width="304" height="190" fill="#0a1118" rx="2"/>
      <text x="10" y="14" fill="#7388a8" font-size="9">INITIAL ORIENTATION</text>
      <rect x="10" y="20" width="284" height="16" fill="#11151e"/>
      <text x="14" y="32" fill="#3ad778" font-size="9">▸ ANATOMICAL AXES [OK]</text>
      <text x="10" y="50" fill="#7388a8" font-size="9">POSITION</text>
      <text x="10" y="62" fill="#909aaa" font-size="8">Top=anterior, Left=patient's R</text>
      <rect x="10" y="66" width="140" height="22" fill="#11151e"/>
      <text x="80" y="80" fill="#cdd0d6" font-size="9" text-anchor="middle">☐ ant_R (123 v)</text>
      <rect x="154" y="66" width="140" height="22" fill="#11151e"/>
      <text x="224" y="80" fill="#cdd0d6" font-size="9" text-anchor="middle">☐ ant_L</text>
      <rect x="10" y="90" width="140" height="22" fill="#11151e"/>
      <text x="80" y="104" fill="#cdd0d6" font-size="9" text-anchor="middle">☐ pos_R</text>
      <rect x="154" y="90" width="140" height="22" fill="#11151e"/>
      <text x="224" y="104" fill="#cdd0d6" font-size="9" text-anchor="middle">☐ pos_L</text>
      <text x="10" y="124" fill="#909aaa" font-size="8">Mask: ALL (0x0F)  Subset: --/--</text>
      <g transform="translate(10, 128)">
        <rect x="0" y="0" width="55" height="14" fill="#1c2030"/>
        <text x="27" y="10" fill="#9aa0a6" font-size="8" text-anchor="middle">All</text>
        <rect x="58" y="0" width="55" height="14" fill="#1c2030"/>
        <text x="86" y="10" fill="#9aa0a6" font-size="8" text-anchor="middle">Right</text>
        <rect x="116" y="0" width="55" height="14" fill="#1c2030"/>
        <text x="143" y="10" fill="#9aa0a6" font-size="8" text-anchor="middle">Left</text>
        <rect x="174" y="0" width="55" height="14" fill="#1c2030"/>
        <text x="202" y="10" fill="#9aa0a6" font-size="8" text-anchor="middle">Ant</text>
        <rect x="232" y="0" width="55" height="14" fill="#1c2030"/>
        <text x="259" y="10" fill="#9aa0a6" font-size="8" text-anchor="middle">Post</text>
      </g>
      <rect x="10" y="148" width="284" height="16" fill="#11151e"/>
      <text x="14" y="160" fill="#7388a8" font-size="9">▸ ORIENTATION  [Base]</text>
      <rect x="10" y="168" width="284" height="16" fill="#1a4480" rx="2"/>
      <text x="152" y="180" fill="#dde6f5" font-size="9" text-anchor="middle">Apply Init Pose</text>
    </g>
    <g transform="translate(8, 288)">
      <rect width="200" height="22" fill="#3b2412" rx="2"/>
      <text x="100" y="15" fill="#f5b078" font-size="9" text-anchor="middle">Hemi Auto  v:0.50</text>
      <rect x="204" width="100" height="22" fill="#3b2412" rx="2"/>
      <text x="254" y="15" fill="#f5b078" font-size="9" text-anchor="middle">AutoProbe</text>
    </g>
    <g transform="translate(8, 314)">
      <rect width="200" height="22" fill="#3b2412" rx="2"/>
      <text x="100" y="15" fill="#f5b078" font-size="9" text-anchor="middle">AutoQCR  6-DoF</text>
      <rect x="204" width="100" height="22" fill="#11151e" rx="2"/>
      <text x="254" y="15" fill="#cdd0d6" font-size="9" text-anchor="middle">☑ 6-DoF</text>
    </g>
    <rect x="8" y="340" width="304" height="14" fill="#11151e" rx="2"/>
    <text x="14" y="350" fill="#7388a8" font-size="9">▸ QCR Tuning</text>
    <g transform="translate(8, 358)">
      <rect width="200" height="24" fill="#3b2412" rx="2"/>
      <text x="100" y="16" fill="#f5b078" font-size="9" text-anchor="middle">Ctrl+G  V3-R  [Refine]</text>
      <rect x="204" width="100" height="24" fill="#11151e" rx="2"/>
      <text x="254" y="16" fill="#cdd0d6" font-size="9" text-anchor="middle">☐ 6-DoF</text>
    </g>
    <rect x="8" y="386" width="304" height="16" fill="#11151e" rx="2"/>
    <text x="160" y="397" fill="#cdd0d6" font-size="9" text-anchor="middle">Umeyama Manual</text>
    <g transform="translate(8, 406)">
      <rect width="150" height="14" fill="#11151e"/>
      <text x="75" y="10" fill="#cdd0d6" font-size="9" text-anchor="middle">Pose Library</text>
      <rect x="154" width="150" height="14" fill="#11151e"/>
      <text x="229" y="10" fill="#cdd0d6" font-size="9" text-anchor="middle">Undo</text>
    </g>
    <g transform="translate(8, 424)">
      <rect width="150" height="14" fill="#2a0e0e"/>
      <text x="75" y="10" fill="#e85555" font-size="9" text-anchor="middle">Reset Reg</text>
      <rect x="154" width="150" height="14" fill="#11151e"/>
      <text x="229" y="10" fill="#cdd0d6" font-size="9" text-anchor="middle">Clear CorresPoints ⚠️</text>
    </g>
    <g transform="translate(8, 442)">
      <rect width="150" height="14" fill="#11151e"/>
      <text x="75" y="10" fill="#cdd0d6" font-size="9" text-anchor="middle">CorresPoints OFF</text>
      <rect x="154" width="150" height="14" fill="#11151e"/>
      <text x="229" y="10" fill="#cdd0d6" font-size="9" text-anchor="middle">Cluster OFF</text>
    </g>
    <rect x="8" y="462" width="304" height="14" fill="#11151e" rx="2"/>
    <text x="14" y="472" fill="#7388a8" font-size="9">▸ Advanced</text>
    <g transform="translate(8, 484)">
      <rect width="150" height="16" fill="#1a2a1a"/>
      <text x="75" y="11" fill="#9fd07a" font-size="9" text-anchor="middle">Proceed Deform &gt;&gt;</text>
      <rect x="154" width="150" height="16" fill="#0e2128"/>
      <text x="229" y="11" fill="#7ec0d0" font-size="9" text-anchor="middle">&lt;&lt; Back Depth</text>
    </g>
    <line x1="0" y1="510" x2="320" y2="510" stroke="#3d4148"/>
    <text x="14" y="526" fill="#9aa0a6" font-size="10">▸ DEFORM</text>
    <text x="14" y="546" fill="#6b7280" font-size="9">Save / Visibility / Info ...</text>
  </g>

  <g transform="translate(20, 470)">
    <rect width="280" height="180" fill="#2a201a" stroke="#5a4030" rx="4"/>
    <text x="14" y="22" fill="#f0a060" font-size="11" font-weight="500">⚠ 検出された問題</text>
    <line x1="0" y1="32" x2="280" y2="32" stroke="#5a4030"/>
    <text x="14" y="50" fill="#cdd0d6" font-size="10">1. Clear CorresPoints は誤配線</text>
    <text x="22" y="64" fill="#9aa0a6" font-size="9">押すと DEPTH の SAM2 用 FG/BG クリック</text>
    <text x="22" y="76" fill="#9aa0a6" font-size="9">を全消し ⟶ バグ修正必須</text>
    <text x="14" y="98" fill="#cdd0d6" font-size="10">2. 常時 floating 3 つで画面ノイズ大</text>
    <text x="22" y="112" fill="#9aa0a6" font-size="9">主動線中ずっと邪魔になる位置</text>
    <text x="14" y="134" fill="#cdd0d6" font-size="10">3. メインに viz トグルが 3 段</text>
    <text x="22" y="148" fill="#9aa0a6" font-size="9">日常運用では触らない debug 設定</text>
    <text x="22" y="160" fill="#9aa0a6" font-size="9">→ Debug panel に集約すべき</text>
  </g>
</svg>
